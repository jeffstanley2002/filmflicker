name: Keep Supabase Active

on:
  schedule:
    - cron: "17 4,16 * * *"
  workflow_dispatch:

jobs:
  ping-api:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health check
        env:
          CINEMATCH_API_URL: ${{ secrets.CINEMATCH_API_URL }}
        run: |
          if [ -z "$CINEMATCH_API_URL" ]; then
            echo "CINEMATCH_API_URL is not configured; skipping keepalive ping."
            exit 0
          fi
          curl --fail --show-error --silent --max-time 20 "$CINEMATCH_API_URL/health"
